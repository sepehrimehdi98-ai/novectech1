name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: novextech-liara-deploy-20261020-215456/package-lock.json
      - name: Install root deploy wrapper and application dependencies
        run: npm install
      - name: Build production frontend
        run: npm run build
      - name: Run tests
        run: npm test
